name: Bug Report
description: Report a reproducible problem in Elitea
title: "[Bug]: "
labels:
  - type:bug
  - meta:needs-triage
type: BUG
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in Elitea.

        Please provide as much detail as possible so the team can review and triage the issue efficiently.

        **Important**
        - Search existing issues and discussions before creating a new report
        - Do not include passwords, API keys, tokens, customer data, or other sensitive information
        - If this issue may describe a security vulnerability, do **not** submit it publicly; use the repository's **Security** tab and select **Report a vulnerability**

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short summary of the problem
      placeholder: Briefly describe the bug
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue in more detail
      placeholder: What happened? When did it happen? What were you trying to do?
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Provide clear steps so the team can reproduce the problem
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected result
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: Describe the actual result
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How serious is this problem for you?
      options:
        - Blocker
        - Critical
        - Relatively Critical
        - Not Critical
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      description: Which Elitea product area is most related to this issue?
      options:
        - Not sure
        - Agents
        - Agent Studio
        - Agent Publishing
        - Chat
        - Pipelines
        - Toolkits
        - Extensions
        - Templates
        - Credentials
        - Settings
        - Roles & Permissions
        - User Profile
        - Notifications
        - Attachments
        - Resources
        - Analytics
        - Monitoring
        - Voice
        - Workflow
        - Apps
        - Login / Authentication

  - type: dropdown
    id: related_integration
    attributes:
      label: Related integration
      description: If applicable, select the integration involved
      options:
        - None
        - GitHub
        - GitLab
        - Jira
        - Confluence
        - Figma
        - SharePoint
        - VS Code
        - Visual Studio
        - JetBrains
        - OAuth
        - OpenAPI
        - Excel
        - CSV
        - PDF

  - type: dropdown
    id: quality_attribute
    attributes:
      label: Quality attribute
      description: If relevant, select the main quality concern
      options:
        - None
        - Performance
        - Usability
        - UI
        - Validation
        - Accessibility
        - Observability

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Is there any temporary workaround?
      placeholder: Describe any workaround, or write "None"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant environment details
      placeholder: |
        - Elitea version:
        - Deployment type:
        - Browser:
        - OS:
        - Region:
        - Integration(s) involved:
    validations:
      required: true

  - type: textarea
    id: screenshots_logs
    attributes:
      label: Screenshots or logs
      description: Add screenshots, screen recordings, or sanitized logs if available
      placeholder: Paste sanitized logs or drag and drop screenshots here

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add anything else that may help the team investigate
      placeholder: Add any additional details here

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues before creating this report
          required: true
        - label: I searched existing discussions in EliteaAI/elitea_community before creating this report
          required: true
        - label: I removed or redacted sensitive information
          required: true
        - label: If this issue is security-sensitive, I will use the repository's private vulnerability reporting flow instead of submitting a public issue
          required: true
