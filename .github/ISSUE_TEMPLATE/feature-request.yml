name: Feature Request
description: Suggest a new feature, enhancement, or product improvement
title: "[Feature]: "
labels:
  - type:feature
  - meta:needs-triage
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for Elitea.

        Use this template for feature requests, enhancements, and product improvement proposals.

        For early-stage brainstorming, broader feedback, or open-ended discussion, please consider using **Discussions** in `EliteaAI/elitea_community` first.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short title for the request
      placeholder: Briefly describe the feature or improvement
    validations:
      required: false

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: Describe the pain point, limitation, or missing capability
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
      placeholder: Describe the feature, workflow, or behavior you want
    validations:
      required: true

  - type: textarea
    id: user_value
    attributes:
      label: User / business value
      description: Why is this important? Who benefits and how?
      placeholder: Explain the expected value, impact, or outcome
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Example use case
      description: Provide a practical example of when this would be used
      placeholder: Describe a realistic workflow or scenario
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Feature area
      description: Which Elitea area is most related to this request?
      options:
        - Not sure
        - Agents
        - Agent Studio
        - Agent Publishing
        - Chat
        - Pipelines
        - Toolkits
        - Extensions
        - Templates
        - Credentials
        - Settings
        - Roles & Permissions
        - User Profile
        - Notifications
        - Attachments
        - Resources
        - Analytics
        - Monitoring
        - Voice
        - Workflow
        - Apps
        - Login / Authentication

  - type: dropdown
    id: related_integration
    attributes:
      label: Related integration
      description: If applicable, select the integration involved
      options:
        - GitHub
        - GitLab
        - Jira
        - Confluence
        - Figma
        - SharePoint
        - VS Code
        - Visual Studio
        - JetBrains
        - OAuth
        - OpenAPI
        - Excel
        - CSV
        - PDF

  - type: dropdown
    id: requested_impact
    attributes:
      label: Requested impact
      description: How important is this request for your use case?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: What conditions would make this request complete or successful?
      placeholder: |
        - [ ] Users can ...
        - [ ] Admins can ...
        - [ ] The system should ...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other approaches or workarounds?
      placeholder: Describe any alternatives, partial solutions, or current workarounds

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, references, links, or related discussions if helpful
      placeholder: Add any supporting material here

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues before creating this request
          required: true
        - label: I searched existing discussions in EliteaAI/elitea_community before creating this request
          required: true
        - label: This request describes a user need or product improvement, not only a technical implementation detail
          required: true
